; BugC2 最小可动 demo —— StickC Plus2 + BugC2 底盘
; 用法:
;   编译:        pio run
;   编译并烧录:  pio run -t upload
;   看串口日志:  pio device monitor
[env:m5stickc-plus2]
platform   = espressif32
board      = m5stick-c            ; StickC Plus2 无官方 board,用 m5stick-c (同 ESP32) 即可烧小程序
framework  = arduino
monitor_speed = 115200

; 串口写死成当前识别到的设备,换口时改这里(或删掉让 pio 自动探测)
upload_port  = /dev/cu.usbserial-58BF0032841
monitor_port = /dev/cu.usbserial-58BF0032841

; 官方库,编译时自动从 GitHub 拉到 .pio(不进仓库)
lib_deps = https://github.com/m5stack/M5Hat-BugC.git
